# Root Hydra config. Override anything on the command line:
#   carvision train backbone=clip_vitb32 head=mlp seed=3 train.max_epochs=50

defaults:
  - backbone: dinov2_vits14
  - head: linear
  - data: stanford_cars
  - _self_

seed: 0

train:
  max_epochs: 100
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  # Early stopping watches validation top-1, never test. The legacy project had no
  # validation split and tuned against test.
  early_stopping_patience: 10
  scheduler: cosine
  warmup_epochs: 5

eval:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  # Temperature for calibration is fit on val and applied to test.
  temperature_scaling: true

tracking:
  # Local file store: no account, no network, works offline.
  mlflow_uri: file:./mlruns
  experiment: carvision

paths:
  # Left empty so carvision.utils.paths resolves them relative to the repo root.
  root: null
